<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dosely App — Prescription Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --red: #e10600;
      --border: #334155;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 18px;
      height: 9px;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--red) 50%, #fff 50%);
      transform: rotate(-30deg);
      display: inline-block;
    }
    main {
      flex: 1;
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    h1 {
      font-size: 28px;
      margin-top: 0;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: var(--red);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
      border: none;
      cursor: pointer;
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo"><span class="dot"></span>Dosely</a>
    <a href="/" style="color:var(--text-muted);text-decoration:none;font-size:14px">← Back to Landing</a>
  </header>
  <main>
    <div id="root" class="app-card">
      <h1>Prescription Assistant</h1>
      <p>Upload a prescription to verify medicines, review dosages and warnings, and generate a personalized schedule.</p>
      <div id="upload-zone" style="border:2px dashed var(--border);border-radius:8px;padding:40px;text-align:center;margin:24px 0">
        <p style="margin:0 0 12px">Drag and drop prescription image here, or click to upload</p>
        <input type="file" id="file-input" style="display:none" accept="image/*,application/pdf">
        <button class="btn" onclick="document.getElementById('file-input').click()">Select File</button>
      </div>
    </div>
  </main>
  <footer>
    Dosely is not medical advice. Always follow your doctor's instructions.
  </footer>
</body>
</html>
